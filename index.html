<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato:300,400,700">
  <link rel="stylesheet" href="style.css" media="screen">
</head>
<body>
  <header class="matrix-banner">
    <img class="matrix-banner__image" src="./eisenhower-matrix.jpg" alt="Eisenhower Matrix">
    <a 
      class="matrix-banner__link" 
      href="https://goal-life.com/page/method/matrix-eisenhower" 
      target="_blank" 
      rel="noopener 
      noreferrer">
      Want more details?
    </a>
  </header>

  <main class="todo-app">
    <section class="todo-app__section">
      <label class="todo-app__label" for="new-task">Add Item</label>
      <div class="todo-app__input-group">
        <input id="new-task" class="todo-app__input todo-app__input--text" type="text">
        <button type="button" class="todo-app__button todo-app__button--add">Add</button>
      </div>
    </section>

    <section class="todo-app__section">
      <h3 class="todo-app__title">Todo</h3>
      <ul id="incompleteTasks" class="todo-app__list">
        <li class="todo-app__task-item">
          <input class="todo-app__checkbox" type="checkbox">
          <label class="todo-app__task-text">Pay Bills</label>
          <input class="todo-app__input todo-app__input--edit" type="text">
          <button type="button" class="todo-app__button todo-app__button--edit">Edit</button>
          <button 
            type="button"
            class="todo-app__button todo-app__button--delete" 
            aria-label="Delete task">
            <img src="./remove.svg" alt="Delete task">
          </button>
        </li>
        <li class="todo-app__task-item todo-app__task-item--edit-mode">
          <input class="todo-app__checkbox" type="checkbox">
          <label class="todo-app__task-text">Go Shopping</label>
          <input class="todo-app__input todo-app__input--save" type="text" value="Go Shopping">
          <button type="button" class="todo-app__button todo-app__button--edit">Save</button>
          <button 
            type="button"
            class="todo-app__button todo-app__button--delete" 
            aria-label="Delete task">
            <img class="todo-app__button-icon" src="./remove.svg" alt="Delete task">
          </button>
        </li>
      </ul>
    </section>
    
    <section class="todo-app__section">
      <h3 class="todo-app__title">Completed</h3>
      <ul id="completed-tasks" class="todo-app__list">
        <li class="todo-app__task-item">
          <input class="todo-app__checkbox" type="checkbox" checked>
          <label class="todo-app__task-text">See the Doctor</label>
          <input class="todo-app__input todo-app__input--edit" type="text">
          <button type="button" class="todo-app__button todo-app__button--edit">Edit</button>
          <button
            type="button" 
            class="todo-app__button todo-app__button--delete" 
            aria-label="Delete task">
            <img class="todo-app__button-icon" src="./remove.svg" alt="Delete task">
          </button>
        </li>
      </ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
